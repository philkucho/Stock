name: stock

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: stock_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
