[project]
name = "stock-autotrader"
version = "0.1.0"
description = "US stock automated trading system using NautilusTrader + Webull OpenAPI"
# Python 3.11 고정: Webull SDK가 grpcio==1.51.1에 핀고정되어 있는데
# 이 grpcio 버전은 Python 3.11까지만 prebuilt wheel을 제공하기 때문.
requires-python = ">=3.11,<3.12"
dependencies = [
    "nautilus_trader>=1.190",
    "webull-python-sdk-core",
    "webull-python-sdk-mdata",
    "webull-python-sdk-quotes-core",
    "webull-python-sdk-trade",
    "webull-python-sdk-trade-events-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "paho-mqtt==1.6.1",  # Pinned by webull-python-sdk-quotes-core
    "websockets>=12.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "finnhub-python>=2.4",
    "feedparser>=6.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["webull_adapter*", "strategies*", "api*", "scanner*", "signals*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
